<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration GSINFO</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .admin-login { max-width: 420px; margin: 15vh auto; padding: 28px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
    .admin-login input { width: 100%; margin: 12px 0; padding: 13px; border: 1px solid var(--line); border-radius: 8px; background: #071113; color: var(--white); }
    .admin-login button { width: 100%; }
    .error { color: #ff9b91; }
  </style>
</head>
<body>
  <main class="admin-login">
    <p class="eyebrow">ESPACE PRIVE</p>
    <h1>Administration</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required autofocus>
      <button class="button primary" type="submit">Se connecter</button>
    </form>
  </main>
</body>
</html>
